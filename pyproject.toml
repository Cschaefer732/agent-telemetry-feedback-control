[project]
name = "agent-telemetry-feedback-control"
version = "0.1.0"
description = "Closed-loop telemetry, KPI scoring, a selector governor, and judge-guarded nightly self-tuning for LLM coding agent fleets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carter Schaefer" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "scikit-learn>=1.4"]

[project.scripts]
flightdeck = "flightdeck.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flightdeck*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
